  const list = screenEl.querySelector('#reqList');

  if(state.requests.length===0){
    list.innerHTML = `<div class="empty-state"><span class="em">📌</span><p>NO REQUESTS YET — GO FIND A BOOK OR NOTES</p></div>`;
    return;
  }

  state.requests.forEach((req, idx)=>{
    const div = document.createElement('div');
    div.className = `card fade-in ${idx%2===0?'tilt-l':'tilt-r'}`;
    const meetupSet = req.status==='accepted' && handoffConfirmed(req.item, state.currentUser.id);
    const canReview = meetupSet && req.pickupConfirmed;
    const pickupPromptHtml = !meetupSet || req.pickupConfirmed ? '' : `
      <button class="btn-primary" style="margin-top:8px;" data-confirmpickup="${idx}">✅ I've received this item</button>
      <div class="helper-text">Confirming unlocks leaving a review for ${escapeHtml(req.item.seller.split(' ')[0])}.</div>
    `;
    const reviewHtml = !canReview ? '' : req.review
      ? `<div class="review-display">Your review: <span class="review-stars-mini">${stars(req.review.rating)}</span>${req.review.text ? ' — "'+escapeHtml(req.review.text)+'"' : ''}</div><button class="btn-secondary" data-review="${idx}">Edit review →</button>`
      : `<button class="btn-secondary" data-review="${idx}">Leave a review →</button>`;
    const canCancel = (req.status==='accepted' && !handoffConfirmed(req.item, state.currentUser.id) && !req.pickupConfirmed);
    const stillHolding = req.status==='accepted' && req.item.saleType==='rent' && req.item.status==='rented';
    const returnItemHtml = !stillHolding ? '' : `
      ${dueStatusHtml(req.item)}
      ${req.item.returnPending
        ? `<div class="status-pill" style="margin-top:8px;">⏳ Waiting for ${escapeHtml(req.item.seller.split(' ')[0])} to confirm the return</div>`
        : `<button class="btn-primary" style="margin-top:8px;" data-borrowerreturn="${idx}">📦 I've returned this item</button>
        <button class="btn-secondary" ${extensionAsked(req.item)?'disabled':''} data-moretime="${idx}">${extensionAsked(req.item) ? '⏰ Extension requested' : '⏰ Ask for more time'}</button>`}
    `;
    div.innerHTML = `
      <div class="req-card">
        <div class="card-row">${thumbHtml(req.item)}<div class="card-main">
          <div class="item-title" style="font-size:15px;">${req.item.emoji} ${escapeHtml(req.item.title)}</div>
          <div class="item-meta">${escapeHtml(req.item.seller)} · <span style="font-weight:600;">${req.item.saleType==='rent' ? '🔁 Renting' : '💰 Buying'}</span>${req.status==='accepted' ? ' · ' + (req.spot ? spotName(req.spot) : '') : ''}</div>
        </div></div>
        <span class="req-status ${req.status}">${req.status.toUpperCase()}</span>
      </div>
      ${req.status==='pending' ? `<div class="status-pill" style="margin-top:8px;">⏳ Waiting for ${escapeHtml(req.item.seller.split(' ')[0])} to respond</div><button class="btn-secondary" style="margin-top:8px;" data-cancelrequest="${idx}">Cancel request</button>` : req.status==='declined' ? `<div class="status-pill" style="margin-top:8px;">❌ ${escapeHtml(req.item.seller.split(' ')[0])} declined this request</div>` : req.status==='cancelled' ? `<div class="status-pill" style="margin-top:8px;">🚫 This request was cancelled</div>` : `<button class="btn-secondary" data-view="${idx}">${req.spot ? 'View meetup details →' : 'Arrange meetup →'}</button>`}
      ${pickupPromptHtml}
      ${reviewHtml}
      ${returnItemHtml}
      ${canCancel ? `<button class="btn-secondary" style="color:#a52d2d;" data-cancelrequest="${idx}">Cancel request</button>` : ''}
      ${req.status==='accepted' && handoffConfirmed(req.item, state.currentUser.id) && !req.pickupConfirmed ? `<div class="helper-text">Can't make it? Ask ${escapeHtml(req.item.seller.split(' ')[0])} to cancel the handoff.</div>` : ''}
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('[data-confirmpickup]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.confirmpickup);
      state.requests[idx].pickupConfirmed = true;
      await sb.from('requests').update({ pickup_confirmed:true }).eq('id', state.requests[idx].dbId);
      renderRequests();
    });
  });

  list.querySelectorAll('[data-cancelrequest]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.cancelrequest);
      const req = state.requests[idx];
      if(!confirm(req.status==='accepted' ? 'Cancel this accepted request?' : 'Cancel this request?')) return;
      btn.disabled = true;
      btn.textContent = 'Cancelling…';
      const ok = await cancelRequest(req.dbId, 'borrower');
      if(!ok){ btn.disabled = false; btn.textContent = 'Cancel request'; return; }
      renderRequests();
    });
  });

  list.querySelectorAll('[data-borrowerreturn]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.borrowerreturn);
      btn.disabled = true;
      await claimItemReturned(state.requests[idx].item.id, state.requests[idx].dbId);
      renderRequests();
    });
  });
  list.querySelectorAll('[data-moretime]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{ await askMoreTime(state.requests[Number(btn.dataset.moretime)].item); renderRequests(); });
  });


  list.querySelectorAll('[data-view]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.view);
      state.activeRequestIdx = idx;
      if(!state.requests[idx].spot){
        state.selectedSpot = null;
        state.selectedTime = '4:00 PM';
      }
      setView(state.requests[idx].spot ? 'success' : 'meet');
    });
  });
  list.querySelectorAll('[data-review]').forEach(btn=>{
    btn.addEventListener('click', ()=> openReview(Number(btn.dataset.review), 'requests'));
  });
}

function renderReceivedRequestsList(){
  const list = screenEl.querySelector('#reqList');

  if(INCOMING_REQUESTS.length===0){
    list.innerHTML = `<div class="empty-state"><span class="em">📥</span><p>NO ONE HAS REQUESTED YOUR ITEMS YET</p></div>`;
    return;
  }

  INCOMING_REQUESTS.forEach((req, idx)=>{
    const item = LISTINGS.find(l=>sameId(l.id,req.itemId));
    if(!item) return;
    const div = document.createElement('div');
    div.className = `card fade-in ${idx%2===0?'tilt-l':'tilt-r'}`;
    let actionsHtml = '';
    if(req.status==='pending'){
      actionsHtml = `
        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="btn-primary" style="margin-top:0;" data-accept="${req.id}">Accept</button>
          <button class="btn-secondary" style="margin-top:0;" data-decline="${req.id}">Decline</button>
        </div>
      `;
    } else if(req.status==='accepted'){
      const confirmed = handoffConfirmed(item, req.requesterId);
      const cancelBtn = req.pickupConfirmed ? '' : `<button class="btn-secondary" style="color:#a52d2d;" data-cancelincoming="${req.id}">Cancel this handoff</button>`;
      actionsHtml = (confirmed
        ? `<div class="item-meta" style="margin-top:6px;">📍 ${spotName(req.spot)} · ${escapeHtml(req.time)}</div><button class="btn-secondary" data-viewincoming="${req.id}">View meetup details →</button>`
        : `${req.spot ? `<div class="item-meta" style="margin-top:6px;">📍 ${escapeHtml(req.requester.split(' ')[0])} suggested ${spotName(req.spot)} · ${escapeHtml(req.time)}</div>` : ''}<button class="btn-secondary" data-arrangeincoming="${req.id}">${req.spot ? 'Confirm meetup →' : 'Arrange meetup →'}</button>`) + cancelBtn;
    }
    const requesterInitials = req.requester.split(' ').map(w=>w[0]).join('').slice(0,2);
    div.innerHTML = `
      <div class="req-card">
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="avatar avatar-clickable" style="width:30px;height:30px;font-size:12px;flex-shrink:0;" data-requesteravatar="${idx}" role="button" tabindex="0" aria-label="View ${escapeHtml(req.requester)}'s profile">${escapeHtml(requesterInitials)}</div>
          <div>
            <div class="item-title" style="font-size:15px;">${item.emoji} ${escapeHtml(item.title)}</div>
            <div class="item-meta">From ${escapeHtml(req.requester)} · ${escapeHtml(req.requesterYear)}</div>
          </div>
        </div>
        <span class="req-status ${req.status}">${req.status.toUpperCase()}</span>
      </div>
      <div class="badge" style="${item.saleType==='rent' ? 'background:var(--sticky-blue);color:#16324f;' : 'background:var(--highlighter);color:#4a3a05;'}margin-bottom:8px;">${item.saleType==='rent' ? '🔁 Wants to rent' : '💰 Wants to buy'}</div>
      ${req.message ? `<div class="review-display">"${escapeHtml(req.message)}"</div>` : ''}
      ${actionsHtml}
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('[data-requesteravatar]').forEach(el=>{
    const idx = Number(el.dataset.requesteravatar);
    const req = INCOMING_REQUESTS[idx];
    const open = ()=> openBorrowerProfile(req.requester, req.requesterYear, req.requesterId);
    el.addEventListener('click', open);
    el.addEventListener('keypress', e=>{ if(e.key==='Enter') open(); });
  });

  list.querySelectorAll('[data-accept]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const req = INCOMING_REQUESTS.find(r=>sameId(r.id,btn.dataset.accept));
      if(!req) return;
      if(INCOMING_REQUESTS.some(r => r.itemId === req.itemId && r.id !== req.id && r.status === 'accepted')){
        alert('You already accepted another request for this item. Cancel that handoff first.');
        return;
      }
      btn.disabled = true;
      const { error } = await sb.from('requests').update({ status:'accepted' }).eq('id', req.id);
      if(error){ console.error('accept request', error); btn.disabled = false; return; }
      req.status = 'accepted';
      const item = LISTINGS.find(l=>sameId(l.id,req.itemId));
      await pushNotification(req.requesterId, {
        icon: '✅',
        title: 'Request accepted!',
        text: `${state.currentUser.name} accepted your request for ${item ? item.emoji+' '+item.title : 'your item'}`,
        action: { view:'requests', tab:'sent' },
      });
      openIncomingMeet(req.id);
    });
  });
  list.querySelectorAll('[data-decline]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const req = INCOMING_REQUESTS.find(r=>sameId(r.id,btn.dataset.decline));
      if(!req) return;
      btn.disabled = true;
      const { error } = await sb.from('requests').update({ status:'declined' }).eq('id', req.id);
      if(error){ console.error('decline request', error); btn.disabled = false; return; }
      req.status = 'declined';
      const item = LISTINGS.find(l=>sameId(l.id,req.itemId));
      await pushNotification(req.requesterId, {
        icon: '❌',
        title: 'Request declined',
        text: `${state.currentUser.name} declined your request for ${item ? item.emoji+' '+item.title : 'this item'}`,
        action: { view:'requests', tab:'sent' },
      });
      renderRequests();
    });
  });
  list.querySelectorAll('[data-cancelincoming]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Cancel this handoff? The item becomes available again.')) return;
      btn.disabled = true;
      await cancelRequest(btn.dataset.cancelincoming, 'lender');
      await refreshListings();
      renderRequests();
    });
  });
  list.querySelectorAll('[data-arrangeincoming]').forEach(btn=>{
    btn.addEventListener('click', ()=> openIncomingMeet(btn.dataset.arrangeincoming));
  });
  list.querySelectorAll('[data-viewincoming]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.activeIncomingRequestId = btn.dataset.viewincoming;
      setView('successIncoming');
    });
  });
}

/* ================= Your Items (seller view) ================= */
function renderMyItems(){
  // "My Items" must only ever show listings the signed-in user actually
  // owns — LISTINGS holds every listing on the whole platform (it's also
  // what Search reads from), so this view needs its own scoped subset.
  const myListings = LISTINGS.filter(l => l.sellerId === state.currentUser.id);
  const total = myListings.length;
  const available = myListings.filter(l=>l.status==='available').length;
  const rented = myListings.filter(l=>l.status==='rented').length;
  const sold = myListings.filter(l=>l.status==='sold').length;
  const overdue = myListings.filter(l=>isOverdue(l)).length;

  const filterLabels = { all:'ALL LISTINGS', available:'AVAILABLE ITEMS', rented:'RENTED OUT ITEMS', sold:'SOLD ITEMS', overdue:'OVERDUE ITEMS' };
  const catNames = { all:'All types', book:'Books', notes:'Notes', pyq:'PYQ' };
  const saleTypeNames = { all:'Buy or rent', buy:'For sale', rent:'For rent' };

  let filtered = myListings.filter(l =>
    (state.myItemsFilter === 'all' ? true
      : state.myItemsFilter === 'overdue' ? isOverdue(l)
      : l.status === state.myItemsFilter) &&
    (state.myItemsCategoryFilter === 'all' ? true : l.kind === state.myItemsCategoryFilter) &&
    (state.myItemsSaleTypeFilter === 'all' ? true : l.saleType === state.myItemsSaleTypeFilter)
  );

  // With no status filter applied, surface active loans first — overdue
  // rentals at the very top, then everything else still rented out.
  if(state.myItemsFilter === 'all'){
    filtered = filtered
      .map((item, originalIndex) => ({ item, originalIndex }))
      .sort((a, b)=>{
        const rank = (l)=> isOverdue(l) ? 0 : (l.status === 'rented' ? 1 : 2);
        const aRank = rank(a.item);
        const bRank = rank(b.item);
        if(aRank !== bRank) return aRank - bRank;
        return a.originalIndex - b.originalIndex;
      })
      .map(e => e.item);
  }

  screenEl.innerHTML = `
    <label class="field-label" style="margin-top:14px;">YOUR ITEMS</label>
    <div class="card summary-card">
      <div class="summary-row summary-row-btn ${state.myItemsFilter==='all'?'active':''}" id="statAll" role="button" tabindex="0"><span class="summary-key">TOTAL LISTED</span><span class="summary-val">${total}</span></div>
      <div class="summary-row summary-row-btn ${state.myItemsFilter==='available'?'active':''}" id="statAvailable" role="button" tabindex="0"><span class="summary-key">AVAILABLE</span><span class="summary-val">${available}</span></div>
      <div class="summary-row summary-row-btn ${state.myItemsFilter==='rented'?'active':''}" id="statRented" role="button" tabindex="0"><span class="summary-key">RENTED OUT</span><span class="summary-val">${rented}</span></div>
      <div class="summary-row summary-row-btn ${state.myItemsFilter==='sold'?'active':''}" id="statSold" role="button" tabindex="0"><span class="summary-key">SOLD</span><span class="summary-val">${sold}</span></div>
      <div class="summary-row summary-row-btn ${state.myItemsFilter==='overdue'?'active':''}" id="statOverdue" role="button" tabindex="0"><span class="summary-key">OVERDUE</span><span class="summary-val">${overdue}</span></div>
    </div>

    <button class="filter-open-btn" id="openMyItemsFiltersBtn">
      <span class="fob-left"><span class="fob-icon">🧰</span> Filter</span>
      <span class="fob-summary">${catNames[state.myItemsCategoryFilter]} · ${saleTypeNames[state.myItemsSaleTypeFilter]} <span class="fob-arrow">→</span></span>
    </button>

    <label class="field-label">${filterLabels[state.myItemsFilter]}</label>
    <div id="myItemsList"></div>
  `;

  const filterMap = { statAll:'all', statAvailable:'available', statRented:'rented', statSold:'sold', statOverdue:'overdue' };
  Object.keys(filterMap).forEach(btnId=>{
    const el = screenEl.querySelector('#'+btnId);
    const setFilter = ()=>{ state.myItemsFilter = filterMap[btnId]; renderMyItems(); };
    el.addEventListener('click', setFilter);
    el.addEventListener('keypress', e=>{ if(e.key==='Enter') setFilter(); });
  });

  screenEl.querySelector('#openMyItemsFiltersBtn').addEventListener('click', ()=> setView('myItemsFilters'));

  const listEl = screenEl.querySelector('#myItemsList');
  if(filtered.length===0){
    listEl.innerHTML = `<div class="empty-state"><span class="em">📦</span><p>NOTHING IN THIS CATEGORY YET</p></div>`;
    return;
  }
  filtered.forEach((item, i)=>{
    const avg = getAverageRating(item.id);
    const div = document.createElement('div');
    div.className = `card fade-in ${i%2===0?'tilt-l':'tilt-r'}`;
    const isRentedOut = item.status === 'rented' && !!item.rentedTo;
    const cond = isRentedOut ? getConditionReview(item.id) : null;
    const borrowerLvl = isRentedOut ? getLevelInfo(getBorrowerScore(item.rentedToId)) : null;
    const overdue = isRentedOut && isOverdue(item);
    const lastRecordIdx = isRentedOut ? -1 : getLastRentalRecordIndex(item.id);
    const lastRecord = lastRecordIdx >= 0 ? RENTAL_HISTORY[lastRecordIdx] : null;
    const borrowerHtml = isRentedOut ? `
      <div class="review-display">Rented to ${escapeHtml(item.rentedTo || 'a student')} ${borrowerChipHtml(item.rentedToId)}${cond ? `<br>Return condition: <span class="review-stars-mini">${stars(cond.rating)}</span>` : ''}${cond && cond.text ? ' — "'+escapeHtml(cond.text)+'"' : ''}</div>
      ${dueStatusHtml(item)}
      ${item.returnPending ? `
        <div class="status-pill" style="margin-top:8px;">📩 ${escapeHtml(item.rentedTo)} says they've returned this</div>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn-primary" style="margin-top:0;" data-confirmreturn="${item.id}">Confirm — got it back</button>
          <button class="btn-secondary" style="margin-top:0;" data-disputereturn="${item.id}">Not yet</button>
        </div>
      ` : `
        <button class="btn-secondary" data-condreview="${item.id}">${cond ? 'Edit review of borrower →' : 'Review the borrower →'}</button>
        <button class="btn-secondary" data-editdue="${item.id}">📅 ${item.dueDate ? 'Change' : 'Set'} return date</button>
        <button class="btn-primary" style="margin-top:8px;" data-markreturned="${item.id}">📦 Mark item as returned</button>
      `}
    ` : (lastRecord ? `
      <div class="review-display">Last rented to ${escapeHtml(lastRecord.borrowerName || 'a student')} ${borrowerChipHtml(lastRecord.borrowerId)}${lastRecord.rating ? `<br>Return condition: <span class="review-stars-mini">${stars(lastRecord.rating)}</span>` : ''}${lastRecord.rating && lastRecord.text ? ' — "'+escapeHtml(lastRecord.text)+'"' : ''}</div>
      <button class="btn-secondary" data-condreview="${item.id}">${lastRecord.rating ? 'Edit review of borrower →' : 'Review the borrower →'}</button>
    ` : '');
    // only an untouched, available listing is safe to delete outright — once
    // it's been rented or sold it's part of the exchange history/reputation record.
    const deleteHtml = item.status === 'available' ? `<button class="btn-secondary" style="margin-top:8px;" data-deletelisting="${item.id}">🗑️ Delete listing</button>` : '';
    div.innerHTML = `
      <div class="card-row">${thumbHtml(item)}<div class="card-main">
        <div class="item-title" style="cursor:pointer;">${item.emoji} ${escapeHtml(item.title)}</div>
        <div class="item-meta">${escapeHtml(item.course)} · ${item.saleType==='rent'?'Listed for rent':'Listed for sale'}</div>
      </div></div>
      <div class="item-bottom">
        <span class="price ${item.free?'free':''}">${escapeHtml(item.price)}</span>
        <div class="item-bottom-right">
          ${statusRowHtml(item.status)}
          ${overdue ? `<span class="badge" style="background:var(--sticky-pink);color:#7a2020;">⚠️ Overdue</span>` : ''}
          ${avg !== null ? `<span class="review-stars-mini" style="font-size:11px;">${stars(Math.round(avg))} (${getItemReviews(item.id).length})</span>` : ''}
        </div>
      </div>
      ${borrowerHtml}
      ${deleteHtml}
    `;
    div.querySelector('.item-title').addEventListener('click', ()=> openDetail(item, 'myitems'));
    listEl.appendChild(div);
  });

  listEl.querySelectorAll('[data-condreview]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openItemBorrowerReview(btn.dataset.condreview);
    });
  });
  listEl.querySelectorAll('[data-editdue]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{ e.stopPropagation(); openEditDue(btn.dataset.editdue); });
  });
  listEl.querySelectorAll('[data-markreturned]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      btn.disabled = true;
      await markItemReturned(btn.dataset.markreturned);
      renderMyItems();
    });
  });
  listEl.querySelectorAll('[data-confirmreturn]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      btn.disabled = true;
      await markItemReturned(btn.dataset.confirmreturn);
      renderMyItems();
    });
  });
  listEl.querySelectorAll('[data-disputereturn]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      btn.disabled = true;
      await disputeItemReturn(btn.dataset.disputereturn);
      renderMyItems();
    });
  });

  listEl.querySelectorAll('[data-deletelisting]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this listing? This can\'t be undone.')) return;
      const listingId = btn.dataset.deletelisting;
      btn.disabled = true;
      btn.textContent = 'Deleting…';
      const { error } = await sb.from('listings').delete().eq('id', listingId);
      if(error){ console.error('delete listing', error); btn.disabled = false; btn.textContent = '🗑️ Delete listing'; return; }
      await refreshListings();
      renderMyItems();
    });
  });
}

  screenEl.innerHTML = `

    <div class="item-title" style="font-size:17px;">${item.emoji} ${escapeHtml(item.title)}</div>

    <div id="spotListIncoming"></div>

    <label class="field-label">PICK A TIME</label>

    </select>

    ${item.saleType==='rent' ? dueDatePickerHtml() : ''}

    <button class="btn-primary" id="confirmIncomingBtn" ${state.selectedSpot && (item.saleType!=='rent' || dueDateValid(resolveDueDate())) ? '' : 'disabled'}>Confirm meetup</button>
  `;

  const spotList = screenEl.querySelector('#spotListIncoming');
  SPOTS.forEach(spot=>{
    const div = document.createElement('div');
    div.className = `spot-option ${state.selectedSpot===spot.id?'selected':''}`;
    div.innerHTML = `
      <input type="radio" name="spotIncoming" ${state.selectedSpot===spot.id?'checked':''} />
      <span class="spot-emoji">${spot.emoji}</span>
      <span class="spot-name">${spot.name}</span>
    `;
    div.addEventListener('click', ()=>{ state.selectedSpot = spot.id; render(); });
    spotList.appendChild(div);
  });

  screenEl.querySelector('#timeSelectIncoming').addEventListener('change', e=> state.selectedTime = e.target.value);
  if(item.saleType==='rent'){
    const cb = screenEl.querySelector('#confirmIncomingBtn');
    bindDueDatePicker(screenEl, ()=>{ cb.disabled = !(state.selectedSpot && dueDateValid(resolveDueDate())); });
  }
  screenEl.querySelector('#confirmIncomingBtn').addEventListener('click', async ()=>{
    if(!state.selectedSpot) return;
    screenEl.querySelector('#confirmIncomingBtn').disabled = true;
    req.spot = state.selectedSpot;
    req.time = state.selectedTime;
    const dueDate = item.saleType==='rent' ? resolveDueDate() : null;
    if(item.saleType==='rent' && !dueDateValid(dueDate)) return;
    await sb.from('requests').update({ spot: state.selectedSpot, meet_time: state.selectedTime }).eq('id', req.dbId);
    const okTx = await completeItemTransaction(item, req.requester, req.requesterId, dueDate);
    if(!okTx){ alert('Could not confirm the meetup. Please try again.'); await refreshListings(); screenEl.querySelector('#confirmIncomingBtn').disabled = false; return; }
    await pushNotification(req.requesterId, {
      icon: '📍',
      title: 'Meetup arranged!',
      text: `${item.emoji} ${escapeHtml(item.title)} — ${spotName(state.selectedSpot)} at ${state.selectedTime}${dueDate ? ' · return by ' + formatDueDate(dueDate) : ''}`,
      action: { view:'requests', tab:'sent' },
    });
    for(const o of INCOMING_REQUESTS.filter(r => r.itemId === item.id && r.id !== req.id && r.status === 'pending')){
      await sb.from('requests').update({ status:'declined' }).eq('id', o.id);
      o.status = 'declined';
      await pushNotification(o.requesterId, { icon:'❌', title:'Request declined', text:`${item.emoji} ${escapeHtml(item.title)} is no longer available`, action:{ view:'requests', tab:'sent' } });
    }
    await refreshListings();
    setView('successIncoming');
  });
}

    return;
  }

  borrowedEntries.forEach(({req, idx}, i)=>{
    const div = document.createElement('div');
    div.className = `card fade-in ${i%2===0?'tilt-l':'tilt-r'}`;
    const meetupSet = handoffConfirmed(req.item, state.currentUser.id);
    const canReview = meetupSet && req.pickupConfirmed;
    const pickupPromptHtml = !meetupSet || req.pickupConfirmed ? '' : `

      : `<button class="btn-secondary" data-review="${idx}">Leave a review →</button>`;
    const stillHolding = req.item.saleType==='rent' && req.item.status==='rented';
    const returnItemHtml = !stillHolding ? '' : `
      ${dueStatusHtml(req.item)}
      ${req.item.returnPending
        ? `<div class="status-pill" style="margin-top:8px;">⏳ Waiting for ${escapeHtml(req.item.seller.split(' ')[0])} to confirm the return</div>`
        : `<button class="btn-primary" style="margin-top:8px;" data-borrowerreturn="${idx}">📦 I've returned this item</button>
        <button class="btn-secondary" ${extensionAsked(req.item)?'disabled':''} data-moretime="${idx}">${extensionAsked(req.item) ? '⏰ Extension requested' : '⏰ Ask for more time'}</button>`}

      </div>
      ${pickupPromptHtml}
      ${reviewHtml}
      ${returnItemHtml}
    `;
    list.appendChild(div);

  list.querySelectorAll('[data-confirmpickup]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.confirmpickup);
      state.requests[idx].pickupConfirmed = true;
      await sb.from('requests').update({ pickup_confirmed:true }).eq('id', state.requests[idx].dbId);
      renderBorrowed();

    btn.addEventListener('click', async ()=>{ await askMoreTime(state.requests[Number(btn.dataset.moretime)].item); renderBorrowed(); });

  list.querySelectorAll('[data-review]').forEach(btn=>{

function renderProfileOverlay(){
  const p = state.viewedProfile;
  profileOverlay.className = `profile-overlay ${p ? 'open' : ''}`;
  if(!p){ profileOverlay.innerHTML = ''; return; }

  const initials = p.name.split(' ').map(w=>w[0]).join('').slice(0,2);

  let statsHtml = '';
  if(p.kind === 'seller'){
    const lvl = getLevelInfo(p.rating * 20 - 10);
    statsHtml = `
      <div class="summary-row"><span class="summary-key">LEVEL</span><span class="summary-val">${lvl.emoji} Lv.${lvl.level} — ${lvl.name}</span></div>
      <div class="summary-row"><span class="summary-key">RATING</span><span class="summary-val">${stars(p.rating)}</span></div>
      <div class="summary-row"><span class="summary-key">VERIFIED BY</span><span class="summary-val">${p.verified} students</span></div>
      <div class="summary-row"><span class="summary-key">ITEMS LISTED</span><span class="summary-val">${p.listingCount}</span></div>
    `;
  } else {
    const lvl = getLevelInfo(p.score);
    const progressPct = Math.round(((p.score - lvl.floor) / (lvl.ceil - lvl.floor)) * 100);
    statsHtml = `
      <div class="summary-row"><span class="summary-key">LEVEL</span><span class="summary-val">${lvl.emoji} Lv.${lvl.level} — ${lvl.name}</span></div>
      <div class="level-bar-track"><div class="level-bar-fill" style="width:${progressPct}%;"></div></div>
      <div class="summary-row" style="margin-top:8px;"><span class="summary-key">ITEMS BORROWED</span><span class="summary-val">${p.borrowedCount}</span></div>
    `;
  }

  profileOverlay.innerHTML = `
    <div class="profile-backdrop" id="profileBackdrop"></div>
    <div class="profile-modal fade-in">
      <button class="profile-modal-close" id="profileCloseBtn" aria-label="Close profile">✕</button>
      <div class="avatar">${escapeHtml(initials)}</div>
      <div class="profile-modal-name">${escapeHtml(p.name)}</div>
      <div class="profile-modal-sub">${p.kind==='seller' ? 'Lister' : 'Borrower'}${p.year ? ' · '+escapeHtml(p.year) : ''}</div>

  profileOverlay.querySelector('#profileBackdrop').addEventListener('click', closeProfileOverlay);

}

/* ================= Sell / Rent (stub listing forms) ================= */
function renderSellRent(mode){
  const isSell = mode === 'sell';
  // form values live in state.sellForm so a validation/upload/insert error
  // (which re-renders this same screen) doesn't wipe out what was typed.
  if(!state.sellForm) state.sellForm = { type:'Book', title:'', course:'', price:'', desc:'', photoFile:null, photoPreview:null };
  const f = state.sellForm;

  screenEl.innerHTML = `
    <div class="fade-in" style="margin-top:24px;">
      <span class="type-tag ${isSell?'college':'student'}">${isSell ? '💰 LIST AN ITEM FOR SALE' : '🔁 LIST AN ITEM FOR RENT'}</span>

      <label class="field-label">PHOTO</label>
      <input type="file" id="sr_photoInput" accept="image/*" style="display:none;" />
      <div id="sr_photoWrap"></div>

      <label class="field-label">ITEM TYPE</label>
      <select id="sr_type">
        <option ${f.type==='Book'?'selected':''}>Book</option>
        <option ${f.type==='Notes'?'selected':''}>Notes</option>
        <option ${f.type==='PYQ Set'?'selected':''}>PYQ Set</option>
      </select>

      <label class="field-label">TITLE</label>
      <input type="text" id="sr_title" placeholder="e.g. Data Structures & Algorithms" value="${escapeHtml(f.title)}" />

      <label class="field-label">COURSE NAME</label>
      <input type="text" id="sr_course" placeholder="e.g. B.Tech CSE" value="${escapeHtml(f.course)}" />

      <label class="field-label">${isSell ? 'PRICE (₹, LEAVE BLANK IF FREE)' : 'RENT PRICE (₹ / WEEK)'}</label>
      <input type="text" id="sr_price" placeholder="${isSell ? 'e.g. 250' : 'e.g. 40'}" value="${escapeHtml(f.price)}" />

      <label class="field-label">CONDITION / NOTES</label>
      <textarea id="sr_desc" rows="3" placeholder="e.g. Good condition, some highlighting">${escapeHtml(f.desc)}</textarea>

      ${state.sellFormError ? `<div class="field-error">${escapeHtml(state.sellFormError)}</div>` : ''}
      <button class="btn-primary" id="sr_submit">${isSell ? 'List for sale' : 'List for rent'}</button>
    </div>
  `;

  const photoInput = screenEl.querySelector('#sr_photoInput');
  const photoWrap = screenEl.querySelector('#sr_photoWrap');

  function showUploadBox(){
    photoWrap.innerHTML = `
      <div class="photo-upload-box" id="sr_photoBox" role="button" tabindex="0">
        <span class="pu-icon">📷</span>
        <span>Tap to add a photo of the item</span>
      </div>
    `;
    bindUploadBox();
  }

  function showPreview(dataUrl){
    photoWrap.innerHTML = `
      <div class="photo-preview fade-in">
        <img src="${dataUrl}" alt="Item photo preview" />
        <button class="photo-remove-btn" id="sr_photoRemove" aria-label="Remove photo">✕</button>
      </div>
    `;
    photoWrap.querySelector('#sr_photoRemove').addEventListener('click', ()=>{
      photoInput.value = '';
      f.photoFile = null;
      f.photoPreview = null;
      showUploadBox();
    });
  }

  function bindUploadBox(){
    const box = photoWrap.querySelector('#sr_photoBox');
    const open = ()=> photoInput.click();
    box.addEventListener('click', open);
    box.addEventListener('keypress', e=>{ if(e.key==='Enter') open(); });
  }

  // restore whatever photo was already picked before a re-render
  if(f.photoPreview) showPreview(f.photoPreview); else showUploadBox();

  photoInput.addEventListener('change', ()=>{
    const file = photoInput.files && photoInput.files[0];
    if(!file) return;
    f.photoFile = file;
    const reader = new FileReader();
    reader.onload = ()=>{ f.photoPreview = reader.result; showPreview(reader.result); };
    reader.readAsDataURL(file);
  });

  screenEl.querySelector('#sr_type').addEventListener('change', e=> f.type = e.target.value);
  screenEl.querySelector('#sr_title').addEventListener('input', e=> f.title = e.target.value);
  screenEl.querySelector('#sr_course').addEventListener('input', e=> f.course = e.target.value);
  screenEl.querySelector('#sr_price').addEventListener('input', e=> f.price = e.target.value);
  screenEl.querySelector('#sr_desc').addEventListener('input', e=> f.desc = e.target.value);

  screenEl.querySelector('#sr_submit').addEventListener('click', async ()=>{
    const title = f.title.trim();
    const course = f.course.trim();
    const condition = f.desc.trim();
    const priceRaw = f.price.trim();
    const kind = f.type === 'Book' ? 'book' : f.type === 'PYQ Set' ? 'pyq' : 'notes';

    if(!title){
      state.sellFormError = 'Please enter a title.';
      return render();
    }
    if(priceRaw && !/^\d+(\.\d{1,2})?$/.test(priceRaw)){ state.sellFormError = 'Enter the price as a plain number, e.g. 250.'; return render(); }
    if(!isSell && !priceRaw){ state.sellFormError = 'Please enter a weekly rent price.'; return render(); }
    if(f.photoFile && f.photoFile.size > 5 * 1024 * 1024){ state.sellFormError = 'Photo must be under 5 MB.'; return render(); }
    state.sellFormError = '';

    const submitBtn = screenEl.querySelector('#sr_submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Listing…';

    try{
      let photoUrl = null;
      if(f.photoFile){
        const safeName = f.photoFile.name.replace(/[^\w.\-]+/g, '_').slice(-60);
        const path = `${state.currentUser.id}/${Date.now()}-${safeName}`;
        const { error: uploadErr } = await sb.storage.from('listing-photos').upload(path, f.photoFile);
        if(uploadErr){
          state.sellFormError = 'Photo upload failed: ' + uploadErr.message;
          return render();
        }
        photoUrl = sb.storage.from('listing-photos').getPublicUrl(path).data.publicUrl;
      }

      const isFree = isSell && !priceRaw;
      const priceText = isFree ? 'Free' : (isSell ? `₹${priceRaw}` : `₹${priceRaw}/week`);

      const { error: insertErr } = await sb.from('listings').insert({
        seller_id: state.currentUser.id,
        kind,
        title,
        course,
        condition,
        price_text: priceText,
        is_free: isFree,
        sale_type: isSell ? 'buy' : 'rent',
        status: 'available',
        photo_url: photoUrl,
      });
      if(insertErr){
        state.sellFormError = insertErr.message;
        return render();
      }

      state.sellForm = null;
      await refreshListings();
      setView('search');
    } catch(err){
      console.error('list item', err);
      state.sellFormError = 'Something went wrong — check your connection and try again.';
      render();
    }
  });
}
function renderSell(){ renderSellRent('sell'); }
function renderRent(){ renderSellRent('rent'); }

  state.rateRating = state.rateRating || 0; state.rateText = state.rateText || '';

      <label class="field-label">YOUR RATING</label>
      <div class="star-rating" id="rateStars"></div>

      <textarea id="rateText" rows="4" placeholder="What's working, and what isn't?">${escapeHtml(state.rateText)}</textarea>
      <button class="btn-primary" id="rateSubmit" ${state.rateRating ? '' : 'disabled'}>Send feedback</button>
    </div>`;
  const wrap = screenEl.querySelector('#rateStars');
  for(let i = 1; i <= 5; i++){
    const b = document.createElement('button');
    b.className = `star-btn ${i <= state.rateRating ? 'filled' : ''}`;
    b.textContent = i <= state.rateRating ? '★' : '☆';
    b.setAttribute('aria-label', `${i} star${i>1?'s':''}`);
    b.addEventListener('click', ()=>{ state.rateRating = i; renderRate(); });
    wrap.appendChild(b);
  }
  screenEl.querySelector('#rateText').addEventListener('input', e => state.rateText = e.target.value);

    if(error){ console.error('app_feedback', error); alert('Could not send feedback right now. Please try again later.'); btn.disabled = false; return; }

  });
}

/* ---------------- app bootstrap ---------------- */
async function initApp(){
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    const ok = await loadCurrentUserAndData(session.user);
    if(ok) state.view = 'search';
    else { manualSignOut = true; try{ await sb.auth.signOut(); }catch(e){} manualSignOut = false; resetSession(); }
  }
  render();
}

/* Keeps the UI in step with the real auth session: expired/revoked sessions,
   sign-out or sign-in from another tab. Supabase warns against awaiting other
   supabase calls inside this callback (it can deadlock), so real work is deferred. */
sb.auth.onAuthStateChange((event, session)=>{
  const authViews = ['login','signup-choose','signup-student','signup-college','signup-success'];
  if(event === 'SIGNED_OUT'){
    if(manualSignOut || !state.currentUser || authViews.includes(state.view)) return;
    setTimeout(()=>{
      resetSession();
      state.loginError = 'Your session expired. Please log in again.';
      setView('login');
    }, 0);
  } else if(event === 'SIGNED_IN' && session && session.user){
    // another tab signed in as a different account → switch this tab over too
    if(state.currentUser && session.user.id !== state.currentUser.id && !authViews.includes(state.view)){
      setTimeout(async ()=>{
        resetSession();
        const ok = await loadCurrentUserAndData(session.user);
        if(ok){ state.view = 'search'; render(); } else { setView('login'); }
      }, 0);
    }
  }
});
initApp();
