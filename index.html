        ${u.type==='student' ? `<div class="summary-row" id="borrowedRow" style="cursor:pointer;" tabindex="0" role="button"><span class="summary-key">ITEMS BORROWED</span><span class="summary-val">${state.requests.filter(r=>r.status==='accepted').length} <span style="color:var(--ink-soft);">→</span></span></div>` : `<div class="summary-row"><span class="summary-key">DOMAIN</span><span class="summary-val">${escapeHtml(u.domain||'')}</span></div>`}
        <div class="summary-row"><span class="summary-key">LEVEL</span><span class="summary-val">${lvl.emoji} Lv.${lvl.level} — ${lvl.name}</span></div>
        <div class="level-bar-track"><div class="level-bar-fill" style="width:${progressPct}%;"></div></div>
        <div class="item-meta" style="margin-top:6px;margin-bottom:0;text-align:right;">Karma score: ${karma}/100</div>
      </div>
      <div class="helper-text" style="text-align:center;">Your level moves up or down based on the reviews your listed items get, and the reviews you get for how you return borrowed items.</div>

      <button class="btn-secondary" id="logoutBtn" style="margin-top:6px;">Log out</button>
    </div>
  `;

  screenEl.querySelector('#logoutBtn').addEventListener('click', async ()=>{
    await sb.auth.signOut();
    state.loggedIn = false;
    state.currentUser = null;
    state.loginId = '';
    state.loginPassword = '';
    setView('login');
  });

  const borrowedRow = screenEl.querySelector('#borrowedRow');
  if(borrowedRow){
    borrowedRow.addEventListener('click', ()=> setView('borrowed'));
    borrowedRow.addEventListener('keypress', e=>{ if(e.key==='Enter') setView('borrowed'); });
  }
}

/* ================= Items borrowed (from profile) ================= */
function renderBorrowed(){
  const borrowedEntries = state.requests
    .map((req, idx) => ({ req, idx }))
    .filter(e => e.req.status === 'accepted');

  screenEl.innerHTML = `<label class="field-label" style="margin-top:14px;">ITEMS BORROWED</label><div id="borrowedList"></div>`;
  const list = screenEl.querySelector('#borrowedList');

  if(borrowedEntries.length===0){
    list.innerHTML = `<div class="empty-state"><span class="em">🎒</span><p>NOTHING BORROWED YET — ACCEPTED REQUESTS SHOW UP HERE</p></div>`;
    return;
  }

  borrowedEntries.forEach(({req, idx}, i)=>{
    const div = document.createElement('div');
    div.className = `card fade-in ${i%2===0?'tilt-l':'tilt-r'}`;
    const meetupSet = !!req.spot;
    const canReview = meetupSet && req.pickupConfirmed;
    const pickupPromptHtml = !meetupSet || req.pickupConfirmed ? '' : `
      <button class="btn-primary" style="margin-top:8px;" data-confirmpickup="${idx}">✅ I've received this item</button>
      <div class="helper-text">Confirming unlocks leaving a review for ${req.item.seller.split(' ')[0]}.</div>
    `;
    const reviewHtml = !canReview ? '' : req.review
      ? `<div class="review-display">Your review: <span class="review-stars-mini">${'★'.repeat(req.review.rating)}${'☆'.repeat(5-req.review.rating)}</span>${req.review.text ? ' — "'+escapeHtml(req.review.text)+'"' : ''}</div><button class="btn-secondary" data-review="${idx}">Edit review →</button>`
      : `<button class="btn-secondary" data-review="${idx}">Leave a review →</button>`;
    const stillHolding = req.item.saleType==='rent' && req.item.status==='rented';
    const returnItemHtml = !stillHolding ? '' : `
      ${dueStatusHtml(req.item)}
      ${req.item.returnPending
        ? `<div class="status-pill" style="margin-top:8px;">⏳ Waiting for ${req.item.seller.split(' ')[0]} to confirm the return</div>`
        : `<button class="btn-primary" style="margin-top:8px;" data-borrowerreturn="${idx}">📦 I've returned this item</button>`}
    `;
    div.innerHTML = `
      <div class="item-title" style="font-size:15px;">${req.item.emoji} ${req.item.title}</div>
      <div class="item-meta">${req.item.course} · From ${req.item.seller}</div>
      <div class="item-bottom">
        <span class="price ${req.item.free?'free':''}">${req.item.price}</span>
        <span class="badge">${req.spot ? SPOTS.find(s=>s.id===req.spot).emoji + ' ' + SPOTS.find(s=>s.id===req.spot).name : 'Meetup pending'}</span>
      </div>
      ${pickupPromptHtml}
      ${reviewHtml}
      ${returnItemHtml}
    `;
    list.appendChild(div);
  });

  list.querySelectorAll('[data-confirmpickup]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = Number(btn.dataset.confirmpickup);
      state.requests[idx].pickupConfirmed = true;
      await sb.from('requests').update({ pickup_confirmed:true }).eq('id', state.requests[idx].dbId);
      renderBorrowed();
    });
  });

  list.querySelectorAll('[data-borrowerreturn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = Number(btn.dataset.borrowerreturn);
      claimItemReturned(state.requests[idx].item.id, state.requests[idx].dbId);
      renderBorrowed();
    });
  });

  list.querySelectorAll('[data-review]').forEach(btn=>{
    btn.addEventListener('click', ()=> openReview(Number(btn.dataset.review), 'borrowed'));
  });
}

/* ================= Menu drawer (side dashboard) ================= */
function closeMenu(){
  state.menuOpen = false;
  renderMenuDrawer();
}

function renderMenuDrawer(){
  const u = state.currentUser;
  const items = [
    { id:'theme', icon: state.theme==='dark' ? '🌙' : '☀️', title:'Theme', desc: state.theme==='dark' ? 'Dark mode is on' : 'Light mode is on', action:'toggle-theme' },
    { id:'history', icon:'🕘', title:'Search history', desc:'Revisit what you\'ve searched for', action:'history' },
    { id:'notif', icon:'🔔', title:'Notification settings', desc:'Choose when S2S pings you about requests' },
    { id:'safety', icon:'🛡️', title:'Safety & meetup tips', desc:'Guidelines for safe on-campus exchanges' },
    { id:'help', icon:'❓', title:'Help & support', desc:'FAQs and how to reach the S2S team' },
    { id:'about', icon:'📄', title:'About S2S', desc:'Student to Student — notes & books, passed along' },
    { id:'rate', icon:'⭐', title:'Rate this app', desc:'Tell us how the exchange went' },
  ];

  menuOverlay.className = `menu-overlay ${state.menuOpen ? 'open' : ''}`;
  menuOverlay.innerHTML = `
    <div class="menu-backdrop" id="menuBackdrop"></div>
    <div class="menu-drawer">
      <div class="menu-drawer-head">
        <span class="menu-drawer-title">Menu</span>
        <button class="menu-close-btn" id="menuCloseBtn" aria-label="Close menu">✕</button>
      </div>

      <div class="menu-actions">
        <button class="menu-action-btn sell" id="menuSellBtn"><span class="maa-icon">💰</span>SELL${isGuest() ? ' 🔒' : ''}</button>
        <button class="menu-action-btn rent" id="menuRentBtn"><span class="maa-icon">🔁</span>RENT${isGuest() ? ' 🔒' : ''}</button>
      </div>

      <div id="menuList"></div>
      <label class="field-label">ACCOUNT</label>
      <button class="btn-secondary" id="menuLogoutBtn">${isGuest() ? 'Log in / Sign up' : 'Log out ' + (u ? '(' + u.uniqueId + ')' : '')}</button>
    </div>
  `;

  const list = menuOverlay.querySelector('#menuList');
  items.forEach((it, i)=>{
    const div = document.createElement('div');
    div.id = `menuItem-${it.id}`;
    div.className = `card fade-in ${i%2===0?'tilt-l':'tilt-r'}`;
    if(it.action){
      div.tabIndex = 0;
      div.setAttribute('role','button');
      div.style.cursor = 'pointer';
    }
    const isThemeToggle = it.action === 'toggle-theme';
    div.innerHTML = `
      <div class="seller-row" style="box-shadow:none;padding:0;background:transparent;margin-bottom:0;">
        <div class="avatar" style="background:var(--kraft-dark);color:var(--ink);font-size:14px;width:28px;height:28px;">${it.icon}</div>
        <div>
          <div class="seller-name">${it.title}</div>
          <div class="item-meta" style="margin-bottom:0;">${it.desc}</div>
        </div>
        ${isThemeToggle
          ? `<div class="theme-switch ${state.theme==='dark'?'on':''}" role="switch" aria-checked="${state.theme==='dark'}" tabindex="0"><div class="theme-switch-knob"></div></div>`
          : (it.action ? '<div class="role-arrow" style="margin-left:auto;">→</div>' : '')}
      </div>
    `;
    if(isThemeToggle){
      div.addEventListener('click', toggleTheme);
      div.addEventListener('keypress', e=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); toggleTheme(); } });
    } else if(it.action){
      const go = ()=>{
        state.menuOpen = false;
        setView(it.action);
      };
      div.addEventListener('click', go);
      div.addEventListener('keypress', e=>{ if(e.key==='Enter') go(); });
    }
    list.appendChild(div);
  });

  menuOverlay.querySelector('#menuBackdrop').addEventListener('click', closeMenu);
  menuOverlay.querySelector('#menuCloseBtn').addEventListener('click', closeMenu);
  menuOverlay.querySelector('#menuSellBtn').addEventListener('click', ()=>{
    state.menuOpen = false;
    state.sellForm = { type:'Book', title:'', course:'', price:'', desc:'', photoFile:null, photoPreview:null };
    state.sellFormError = '';
    setView('sell');
  });
  menuOverlay.querySelector('#menuRentBtn').addEventListener('click', ()=>{
    state.menuOpen = false;
    state.sellForm = { type:'Book', title:'', course:'', price:'', desc:'', photoFile:null, photoPreview:null };
    state.sellFormError = '';
    setView('rent');
  });
  menuOverlay.querySelector('#menuLogoutBtn').addEventListener('click', async ()=>{
    if(isGuest()){ leaveGuest('login'); return; }
    state.menuOpen = false;
    await sb.auth.signOut();
    state.loggedIn = false;
    state.currentUser = null;
    state.loginId = '';
    state.loginPassword = '';
    setView('login');
  });
}

/* ================= Notification dropdown panel ================= */
function renderNotifPanel(){
  notifOverlay.className = `notif-overlay ${state.notifOpen ? 'open' : ''}`;
  if(!state.notifOpen){ notifOverlay.innerHTML = ''; return; }

  notifOverlay.innerHTML = `
    <div class="notif-backdrop" id="notifBackdrop"></div>
    <div class="notif-panel">
      <div class="notif-panel-head">
        <span class="notif-panel-title">Notifications</span>
        <button class="menu-close-btn" id="notifCloseBtn" aria-label="Close notifications">✕</button>
      </div>
      <div id="notifList"></div>
    </div>
  `;

  const list = notifOverlay.querySelector('#notifList');
  if(state.notifications.length === 0){
    list.innerHTML = `<div class="empty-state" style="padding-top:20px;"><span class="em">🔔</span><p>NOTHING YET — WE'LL LET YOU KNOW WHEN SOMETHING HAPPENS</p></div>`;
  } else {
    state.notifications.forEach(notif=>{
      const btn = document.createElement('button');

/* ================= Profile stats overlay ================= */
function openSellerProfile(item){
  state.viewedProfile = {
    kind: 'seller',
    name: item.seller,
    year: item.year,
    rating: item.rating,
    verified: item.verified,
    listingCount: LISTINGS.filter(l => l.seller === item.seller).length,
  };
  renderProfileOverlay();
}

function openBorrowerProfile(name, year){
  state.viewedProfile = {
    kind: 'borrower',
    name,
    year,
    score: getBorrowerScore(name),
    borrowedCount: getBorrowerRentalCount(name),
  };
  renderProfileOverlay();
}

function closeProfileOverlay(){
  state.viewedProfile = null;
  renderProfileOverlay();
}

function renderProfileOverlay(){
  const p = state.viewedProfile;
  profileOverlay.className = `profile-overlay ${p ? 'open' : ''}`;
  if(!p){ profileOverlay.innerHTML = ''; return; }

  const initials = p.name.split(' ').map(w=>w[0]).join('').slice(0,2);

  let statsHtml = '';
  if(p.kind === 'seller'){
    const lvl = getLevelInfo(p.rating * 20 - 10);
    statsHtml = `
      <div class="summary-row"><span class="summary-key">LEVEL</span><span class="summary-val">${lvl.emoji} Lv.${lvl.level} — ${lvl.name}</span></div>
      <div class="summary-row"><span class="summary-key">RATING</span><span class="summary-val">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}</span></div>
      <div class="summary-row"><span class="summary-key">VERIFIED BY</span><span class="summary-val">${p.verified} students</span></div>
      <div class="summary-row"><span class="summary-key">ITEMS LISTED</span><span class="summary-val">${p.listingCount}</span></div>
    `;
  } else {
    const lvl = getLevelInfo(p.score);
    const progressPct = Math.round(((p.score - lvl.floor) / (lvl.ceil - lvl.floor)) * 100);
    statsHtml = `
      <div class="summary-row"><span class="summary-key">LEVEL</span><span class="summary-val">${lvl.emoji} Lv.${lvl.level} — ${lvl.name}</span></div>
      <div class="level-bar-track"><div class="level-bar-fill" style="width:${progressPct}%;"></div></div>
      <div class="summary-row" style="margin-top:8px;"><span class="summary-key">ITEMS BORROWED</span><span class="summary-val">${p.borrowedCount}</span></div>
    `;
  }

  profileOverlay.innerHTML = `
    <div class="profile-backdrop" id="profileBackdrop"></div>
    <div class="profile-modal fade-in">
      <button class="profile-modal-close" id="profileCloseBtn" aria-label="Close profile">✕</button>
      <div class="avatar">${escapeHtml(initials)}</div>
      <div class="profile-modal-name">${escapeHtml(p.name)}</div>
      <div class="profile-modal-sub">${p.kind==='seller' ? 'Lister' : 'Borrower'}${p.year ? ' · '+escapeHtml(p.year) : ''}</div>
      <div class="profile-modal-stats">${statsHtml}</div>
    </div>
  `;

  profileOverlay.querySelector('#profileBackdrop').addEventListener('click', closeProfileOverlay);
  profileOverlay.querySelector('#profileCloseBtn').addEventListener('click', closeProfileOverlay);
}

/* ================= Sell / Rent (stub listing forms) ================= */
function renderSellRent(mode){
  const isSell = mode === 'sell';
  // form values live in state.sellForm so a validation/upload/insert error
  // (which re-renders this same screen) doesn't wipe out what was typed.
  if(!state.sellForm) state.sellForm = { type:'Book', title:'', course:'', price:'', desc:'', photoFile:null, photoPreview:null };
  const f = state.sellForm;

  screenEl.innerHTML = `
    <div class="fade-in" style="margin-top:24px;">
      <span class="type-tag ${isSell?'college':'student'}">${isSell ? '💰 LIST AN ITEM FOR SALE' : '🔁 LIST AN ITEM FOR RENT'}</span>

      <label class="field-label">PHOTO</label>
      <input type="file" id="sr_photoInput" accept="image/*" style="display:none;" />
      <div id="sr_photoWrap"></div>

      <label class="field-label">ITEM TYPE</label>
      <select id="sr_type">
        <option ${f.type==='Book'?'selected':''}>Book</option>
        <option ${f.type==='Notes'?'selected':''}>Notes</option>
        <option ${f.type==='PYQ Set'?'selected':''}>PYQ Set</option>
      </select>

      <label class="field-label">TITLE</label>
      <input type="text" id="sr_title" placeholder="e.g. Data Structures & Algorithms" value="${escapeHtml(f.title)}" />

      <label class="field-label">COURSE NAME</label>
      <input type="text" id="sr_course" placeholder="e.g. B.Tech CSE" value="${escapeHtml(f.course)}" />

      <label class="field-label">${isSell ? 'PRICE (₹, LEAVE BLANK IF FREE)' : 'RENT PRICE (₹ / WEEK)'}</label>
      <input type="text" id="sr_price" placeholder="${isSell ? 'e.g. 250' : 'e.g. 40'}" value="${escapeHtml(f.price)}" />

      <label class="field-label">CONDITION / NOTES</label>
      <textarea id="sr_desc" rows="3" placeholder="e.g. Good condition, some highlighting">${escapeHtml(f.desc)}</textarea>

      ${state.sellFormError ? `<div class="field-error">${state.sellFormError}</div>` : ''}
      <button class="btn-primary" id="sr_submit">${isSell ? 'List for sale' : 'List for rent'}</button>
    </div>
  `;

  const photoInput = screenEl.querySelector('#sr_photoInput');
  const photoWrap = screenEl.querySelector('#sr_photoWrap');

  function showUploadBox(){
    photoWrap.innerHTML = `
      <div class="photo-upload-box" id="sr_photoBox" role="button" tabindex="0">
        <span class="pu-icon">📷</span>
        <span>Tap to add a photo of the item</span>
      </div>
    `;
    bindUploadBox();
  }

  function showPreview(dataUrl){
    photoWrap.innerHTML = `
      <div class="photo-preview fade-in">
        <img src="${dataUrl}" alt="Item photo preview" />
        <button class="photo-remove-btn" id="sr_photoRemove" aria-label="Remove photo">✕</button>
      </div>
    `;
    photoWrap.querySelector('#sr_photoRemove').addEventListener('click', ()=>{
      photoInput.value = '';
      f.photoFile = null;
      f.photoPreview = null;
      showUploadBox();
    });
  }

  function bindUploadBox(){
    const box = photoWrap.querySelector('#sr_photoBox');
    const open = ()=> photoInput.click();
    box.addEventListener('click', open);
    box.addEventListener('keypress', e=>{ if(e.key==='Enter') open(); });
  }

  // restore whatever photo was already picked before a re-render
  if(f.photoPreview) showPreview(f.photoPreview); else showUploadBox();

  photoInput.addEventListener('change', ()=>{
    const file = photoInput.files && photoInput.files[0];
    if(!file) return;
    f.photoFile = file;
    const reader = new FileReader();
    reader.onload = ()=>{ f.photoPreview = reader.result; showPreview(reader.result); };
    reader.readAsDataURL(file);
  });

  screenEl.querySelector('#sr_type').addEventListener('change', e=> f.type = e.target.value);
  screenEl.querySelector('#sr_title').addEventListener('input', e=> f.title = e.target.value);
  screenEl.querySelector('#sr_course').addEventListener('input', e=> f.course = e.target.value);
  screenEl.querySelector('#sr_price').addEventListener('input', e=> f.price = e.target.value);
  screenEl.querySelector('#sr_desc').addEventListener('input', e=> f.desc = e.target.value);

  screenEl.querySelector('#sr_submit').addEventListener('click', async ()=>{
    const title = f.title.trim();
    const course = f.course.trim();
    const condition = f.desc.trim();
    const priceRaw = f.price.trim();
    const kind = f.type === 'Book' ? 'book' : f.type === 'PYQ Set' ? 'pyq' : 'notes';

    if(!title){
      state.sellFormError = 'Please enter a title.';
      return render();
    }
    state.sellFormError = '';

    const submitBtn = screenEl.querySelector('#sr_submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Listing…';

    try{
      let photoUrl = null;
      if(f.photoFile){
        const path = `${state.currentUser.id}/${Date.now()}-${f.photoFile.name}`;
        const { error: uploadErr } = await sb.storage.from('listing-photos').upload(path, f.photoFile);
        if(uploadErr){
          state.sellFormError = 'Photo upload failed: ' + uploadErr.message;
          return render();
        }
        photoUrl = sb.storage.from('listing-photos').getPublicUrl(path).data.publicUrl;
      }

      const isFree = isSell && !priceRaw;
      const priceText = isFree ? 'Free' : (isSell ? `₹${priceRaw}` : `₹${priceRaw}/week`);

      const { error: insertErr } = await sb.from('listings').insert({
        seller_id: state.currentUser.id,
        kind,
        title,
        course,
        condition,
        price_text: priceText,
        is_free: isFree,
        sale_type: isSell ? 'buy' : 'rent',
        status: 'available',
        photo_url: photoUrl,
      });
      if(insertErr){
        state.sellFormError = insertErr.message;
        return render();
      }

      state.sellForm = null;
      await refreshListings();
      setView('search');
    } catch(err){
      logErr('list item', err);
      state.sellFormError = 'Something went wrong — check your connection and try again.';
      render();
    }
  });
}
function renderSell(){ renderSellRent('sell'); }
function renderRent(){ renderSellRent('rent'); }
